<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@sefaria/web-components@0.1.0-alpha.0/dist/browser/sefaria-elements.js"

<sefaria-source-card sref="Micah 6:6-8" selectable></sefaria-source-card>
<sefaria-connections-panel sref="Micah 6:8"></sefaria-connections-panel>
<script type="module">
  const card = document.querySelector("sefaria-source-card");
  const panel = document.querySelector("sefaria-connections-panel");
  card.selectedPosition = [2];
  card.addEventListener("sefaria-source-select", (event) => {
    card.selectedPosition = event.detail.position;
    panel.sref = event.detail.ref;
  });
</script>
