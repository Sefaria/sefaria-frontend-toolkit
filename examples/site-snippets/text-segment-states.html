<script
  type="module"
  src="https://cdn.jsdelivr.net/npm/@sefaria/web-components@0.1.0-alpha.0/dist/browser/sefaria-elements.js"
></script>
<sefaria-text-segment sref="Micah 6:8"></sefaria-text-segment>
<sefaria-text-segment sref="Not a book 3:4"></sefaria-text-segment>
<sefaria-text-segment></sefaria-text-segment>
<button type="button" id="check">Show each status</button>
<pre id="log"></pre>
<script type="module">
  const log = document.querySelector("#log");
  document.addEventListener("sefaria-text-segment-error", (event) => {
    log.textContent += `Error for ${event.detail.sref}: ${event.detail.error.message}\n`;
  });
  document.querySelector("#check").addEventListener("click", () => {
    for (const element of document.querySelectorAll("sefaria-text-segment")) {
      log.textContent += `"${element.sref}" is ${element.status}\n`;
    }
  });
</script>
