name: CI

on:
  pull_request:
    branches:
      - main
      - release/docs
  push:
    branches:
      - main
      - release/docs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    uses: ./.github/workflows/validate-toolkit.yml

  check:
    name: check
    if: ${{ always() }}
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation platform
        run: |
          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "Validation result: ${{ needs.validation.result }}"
            exit 1
          fi
