name: Numbered npm release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare draft assets, publish captured assets, or verify and finalize
        required: true
        type: choice
        options:
          - prepare
          - publish
          - verify-finalize
      version:
        description: Exact reviewed Changesets version
        required: true
        type: string
      source:
        description: Full reviewed main source SHA (current main for preparation)
        required: true
        type: string
      resume:
        description: Explicitly allow integrity-confirmed existing npm versions
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SOURCE: ${{ inputs.source }}
  RELEASE_RESUME: ${{ inputs.resume }}
  RELEASE_OPERATION: ${{ inputs.operation }}

jobs:
  guard:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      controller: ${{ steps.history.outputs.controller }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: history
        run: |
          node scripts/npm-release.mjs assert-history
          echo "controller=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          path: candidate
      - run: node scripts/npm-release.mjs assert-source
        env:
          RELEASE_REPOSITORY: candidate

  prepare:
    needs: guard
    if: ${{ inputs.operation == 'prepare' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.controller }}
          path: control
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          path: candidate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: control/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: |
            control/pnpm-lock.yaml
            candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: control
      - run: pnpm setup:agent
        working-directory: candidate
      - run: npm install --global npm@11.5.2
      - run: node ../control/scripts/npm-release.mjs assert-source
        working-directory: candidate
        env:
          RELEASE_REPOSITORY: ${{ github.workspace }}/candidate
      - run: pnpm check
        working-directory: candidate
        env:
          SEFARIA_RELEASE_PREPARE: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-npm-${{ runner.os }}
          path: candidate/.artifacts/npm-release/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [guard, prepare]
    if: ${{ always() && needs.guard.result == 'success' && ((inputs.operation == 'prepare' && needs.prepare.result == 'success') || (inputs.operation != 'prepare' && needs.prepare.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.controller }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: ${{ inputs.operation == 'prepare' }}
        with:
          pattern: qualified-npm-*
          path: .artifacts/platforms
      - run: node scripts/npm-release.mjs compare-platforms
        if: ${{ inputs.operation == 'prepare' }}
      - run: node scripts/npm-release.mjs upload
        if: ${{ inputs.operation == 'prepare' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: node scripts/npm-release.mjs capture
        if: ${{ inputs.operation != 'prepare' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.operation != 'prepare' }}
        with:
          name: captured-npm
          path: .artifacts/npm-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, draft]
    if: ${{ always() && inputs.operation == 'publish' && needs.guard.result == 'success' && needs.draft.result == 'success' }}
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.controller }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm install --global npm@11.5.2 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: captured-npm
          path: .artifacts/npm-release
      - run: node scripts/npm-release.mjs publish

  verify:
    needs: [guard, draft, publish]
    if: ${{ always() && needs.draft.result == 'success' && ((inputs.operation == 'publish' && needs.publish.result == 'success') || (inputs.operation == 'verify-finalize' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.controller }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.5.2
      - uses: actions/download-artifact@v4
        with:
          name: captured-npm
          path: .artifacts/npm-release
      - run: node scripts/npm-release.mjs verify

  finalize:
    needs: [guard, draft, verify]
    if: ${{ always() && needs.guard.result == 'success' && needs.draft.result == 'success' && needs.verify.result == 'success' }}
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.controller }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.5.2
      - uses: actions/download-artifact@v4
        with:
          name: captured-npm
          path: .artifacts/npm-release
      - run: node scripts/npm-release.mjs finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
